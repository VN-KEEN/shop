<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VN-KEEN Shop - Mua sắm trực tuyến</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">🛍️ VN-KEEN Shop</div>
            <div class="nav-links">
                <a href="#" class="nav-link">Trang chủ</a>
                <a href="#products" class="nav-link">Sản phẩm</a>
                <a href="#" class="nav-link">Liên hệ</a>
                <button id="cartBtn" class="nav-link cart-btn">
                    🛒 Giỏ hàng <span id="cartCount" class="badge">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>Chào mừng đến VN-KEEN Shop</h1>
            <p>Khám phá những sản phẩm chất lượng cao với giá tốt nhất</p>
            <button class="btn btn-primary" onclick="document.getElementById('products').scrollIntoView()">
                Mua sắm ngay
            </button>
        </div>
    </section>

    <!-- Products Section -->
    <section id="products" class="products-section">
        <div class="container">
            <h2>Các sản phẩm nổi bật</h2>
            <div id="productsGrid" class="products-grid">
                <!-- Products will be loaded here by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Cart Modal -->
    <div id="cartModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>🛒 Giỏ hàng của bạn</h2>
            <div id="cartItems" class="cart-items">
                <!-- Cart items will be displayed here -->
            </div>
            <div class="cart-summary">
                <div class="summary-row">
                    <span>Tổng tiền:</span>
                    <span id="totalPrice" class="total">0 ₫</span>
                </div>
                <button class="btn btn-success" onclick="checkout()">Thanh toán</button>
                <button class="btn btn-secondary" onclick="clearCart()">Xóa giỏ hàng</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 VN-KEEN Shop. All rights reserved.</p>
            <p>Email: contact@vn-keen.shop | Phone: +84 123 456 789</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
